plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.ayachinene'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.baomidou:mybatis-plus-spring-boot4-starter:3.5.17'
    implementation 'com.alipay.sdk:alipay-sdk-java:4.40.938.ALL'
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
    implementation 'io.vavr:vavr:1.0.1'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

application {
    mainClass = 'org.ayachinene.Main'
}

tasks.register('alipayPagePayTest', JavaExec) {
    group = 'application'
    description = 'Run the Alipay sandbox page-pay test'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.ayachinene.AlipayPagePayTestMain'
}

test {
    useJUnitPlatform()
}
